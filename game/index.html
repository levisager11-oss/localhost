<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181b1f">
  <meta name="description" content="An idle game: from a Raspberry Pi in your bedroom to a hyperscale datacenter.">
  <title>localhost</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
/* Toki save support v9. Put this in the game's HTML <head>, before the game's own scripts.
   Inside Toki, it keeps a copy of everything the game stores in localStorage, so progress
   survives closing the app (iPhone deletes storage of games shown inside other sites) and
   follows logged-in players to other devices. Outside Toki it does nothing.
   High scores: call toki.score(points) when a round ends (for times: milliseconds).
   toki.score(points, "id") sends it to another of the game's lists instead (ids as set on Toki).
   Achievements: call toki.achievement("id") when the player earns one (ids as set on Toki).
   Multiplayer: call toki.room(code) when the player is in a room others can join with that
   code (toki.room(null) when they leave it), so they can invite their Toki friends.
   toki.onHost(fn): Toki calls fn when the player invites friends before a room is open; open a
   room for them in it (and call toki.room(code) as always), so they don't have to.
   toki.onName(fn): Toki calls fn with the name the player goes by (their Toki name, or one they
   chose in Toki), now if it knows it and again when it changes; use it in rooms instead of asking.
   toki.name has it too (null until Toki said).
   On phones inside Toki, swipes and quick taps in the game don't scroll or zoom the Toki page
   around it (only where the game itself has nothing to scroll). */
(function () {
  // Games hosted on Toki get this script added for them; a second copy in the game does nothing.
  if (window.__tokiSave) return;
  window.__tokiSave = 1;
  var top = window.parent;
  var inToki = top !== window;
  var origin = (location.ancestorOrigins && location.ancestorOrigins[0]) ||
    (document.referrer ? new URL(document.referrer).origin : "*");
  window.toki = window.toki || {};
  window.toki.score = function (n, board) {
    if (!inToki || typeof n !== "number" || !isFinite(n)) return;
    var m = { toki: 1, type: "score", data: n };
    if ((typeof board === "string" || typeof board === "number") && String(board)) m.board = String(board).slice(0, 32);
    top.postMessage(m, origin);
  };
  window.toki.achievement = function (id) {
    if (inToki && (typeof id === "string" || typeof id === "number") && String(id)) top.postMessage({ toki: 1, type: "achievement", data: String(id).slice(0, 32) }, origin);
  };
  window.toki.room = function (code) {
    if (inToki) top.postMessage({ toki: 1, type: "room", data: code == null || code === "" ? null : String(code) }, origin);
  };
  var hostFn = null;
  window.toki.onHost = function (fn) {
    hostFn = typeof fn === "function" ? fn : null;
    if (inToki) top.postMessage({ toki: 1, type: "host", data: !!hostFn }, origin);
  };
  var nameFns = [];
  window.toki.name = null;
  window.toki.onName = function (fn) {
    if (typeof fn !== "function") return;
    nameFns.push(fn);
    if (inToki) top.postMessage({ toki: 1, type: "names", data: true }, origin);
    if (window.toki.name) try { fn(window.toki.name); } catch (err) { /* the game's own error */ }
  };
  if (!inToki) return;
  // Phones (iPhone above all) pass a swipe or a fast double tap in a game up to the Toki page,
  // which then scrolls or zooms away from the game mid-play. Stop that, except where the game
  // itself has something to scroll. Games keep their own touch-action: this one has no weight.
  if ("ontouchstart" in window) {
    var css = document.createElement("style");
    css.textContent = ":where(html){touch-action:manipulation}";
    (document.head || document.documentElement).appendChild(css);
    var scrolls = function (el) {
      for (; el && el.nodeType === 1; el = el.parentNode) {
        var st = getComputedStyle(el);
        if ((/(auto|scroll)/.test(st.overflowY) && el.scrollHeight > el.clientHeight + 1) ||
            (/(auto|scroll)/.test(st.overflowX) && el.scrollWidth > el.clientWidth + 1)) return true;
      }
      var root = document.scrollingElement || document.documentElement;
      var shut = function (n) { return n && /hidden|clip/.test(getComputedStyle(n).overflow); };
      if (shut(document.documentElement) || shut(document.body)) return false;
      return root.scrollHeight > window.innerHeight + 1 || root.scrollWidth > window.innerWidth + 1;
    };
    var free = true;
    document.addEventListener("touchstart", function (e) {
      free = e.touches.length < 2 && scrolls(e.target);
    }, { passive: true, capture: true });
    document.addEventListener("touchmove", function (e) {
      if ((!free || e.touches.length > 1) && e.cancelable) e.preventDefault();
    }, { passive: false, capture: true });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (e.source !== top || !m || m.toki !== 1) return;
    if (m.type === "host" && hostFn) {
      try { hostFn(); } catch (err) { /* the game's own error: the player can still open a room by hand */ }
    }
    if (m.type === "name" && typeof m.data === "string") {
      var n = m.data.replace(/[\u0000-\u001f<>]/g, "").replace(/\s+/g, " ").trim().slice(0, 20);
      if (!n || n === window.toki.name) return;
      window.toki.name = n;
      for (var i = 0; i < nameFns.length; i++) try { nameFns[i](n); } catch (err) { /* the game's own error */ }
    }
  });
  var ls, MARK = "__toki_t";
  try { ls = window.localStorage; ls.getItem(MARK); } catch (e) { return; }
  var P = Storage.prototype, raw = { set: P.setItem, clear: P.clear };
  var ready = false, answered = false, restoring = false, timer = null;

  function send(type, data) { top.postMessage({ toki: 1, type: type, data: data }, origin); }
  function keys() {
    var out = {};
    for (var i = 0; i < ls.length; i++) { var k = ls.key(i); if (k !== MARK) out[k] = ls.getItem(k); }
    return out;
  }
  function flush() {
    clearTimeout(timer); timer = null;
    var t = Date.now();
    raw.set.call(ls, MARK, String(t));
    send("store", { keys: keys(), t: t });
  }
  // Games often save while the app is closing: send that right away.
  function later() { if (document.hidden) return flush(); clearTimeout(timer); timer = setTimeout(flush, 400); }

  ["setItem", "removeItem", "clear"].forEach(function (name) {
    var fn = P[name];
    P[name] = function () {
      // Putting Toki's save back: the game may still save its old state before the reload.
      if (this === ls && restoring) return;
      var r = fn.apply(this, arguments);
      if (this === ls && ready) later();
      return r;
    };
  });

  window.addEventListener("message", function (e) {
    var m = e.data;
    if (e.source !== top || !m || m.toki !== 1 || m.type !== "save" || answered) return;
    answered = true;
    var save = m.data, mine = Number(ls.getItem(MARK)) || 0;
    if (save && save.keys && save.t > mine) {
      // Toki has newer progress: put it back and restart the game once.
      raw.clear.call(ls);
      for (var k in save.keys) raw.set.call(ls, k, save.keys[k]);
      raw.set.call(ls, MARK, String(save.t));
      restoring = true;
      location.reload();
      return;
    }
    ready = true;
    var has = false;
    for (var key in keys()) { has = true; break; }
    if (has && (!save || mine > save.t)) later();
  });
  // No answer (an older Toki): after a while, keep the game working as before.
  setTimeout(function () { ready = true; }, 10000);
  window.addEventListener("pagehide", function () { if (timer) flush(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && timer) flush(); });
  send("hello");
})();
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="toolbar">
    <nav class="crumbs" aria-label="localhost">
      <svg class="logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <rect x="3" y="4" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="3" y="14" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="7" cy="7" r="1.2" fill="#73bf69"/><circle cx="7" cy="17" r="1.2" fill="#73bf69"/>
        <path d="M12 7h6M12 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="crumb">Home</span><span class="sep" aria-hidden="true">›</span>
      <span class="crumb" data-t="crumbs"></span><span class="sep" aria-hidden="true">›</span>
      <span class="crumb">localhost</span><span class="sep" aria-hidden="true">›</span>
      <strong id="stage"></strong>
    </nav>
    <div class="balance">
      <span class="label" data-t="top.balance"></span>
      <output id="money"></output>
      <span id="rate" class="rate"></span>
    </div>
    <div class="tools">
      <span class="chip" id="away-chip"><span class="ico" data-icon="moon"></span><span id="away"></span></span>
      <button id="btn-exit" class="btn" type="button" data-t="top.exit"></button>
      <button id="btn-stats" class="btn" type="button" data-t="top.stats"></button>
      <button id="btn-lang" class="btn" type="button" data-t="top.lang"></button>
      <button id="btn-sound" class="btn square" type="button"></button>
    </div>
  </header>

  <main class="board">
    <div class="left">
      <section class="panel stat" id="p-rev" aria-labelledby="h-rev">
        <h2 id="h-rev" data-t="panel.revenue"></h2>
        <p class="big" id="rev-value"></p>
        <p class="sub" id="rev-sub"></p>
        <div class="spark"><canvas id="c-rev" role="img"></canvas><div class="tip" hidden></div></div>
      </section>
      <section class="panel stat" id="p-power" aria-labelledby="h-power">
        <h2 id="h-power" data-t="panel.power"></h2>
        <div class="gauge" id="g-power"></div>
        <p class="sub status" id="power-status"></p>
        <p class="sub" id="power-sub"></p>
      </section>
      <section class="panel stat" id="p-temp" aria-labelledby="h-temp">
        <h2 id="h-temp" data-t="panel.temp"></h2>
        <div class="gauge" id="g-temp"></div>
        <p class="sub status" id="temp-status"></p>
        <p class="sub" id="temp-sub"></p>
      </section>
      <section class="panel stat" id="p-uptime" aria-labelledby="h-uptime">
        <h2 id="h-uptime" data-t="panel.uptime"></h2>
        <p class="big" id="uptime-value"></p>
        <p class="sub status" id="uptime-status"></p>
        <p class="sub" id="uptime-streak"></p>
        <div class="ops" id="ops">
          <p class="sub" id="ops-label"></p>
          <div class="meter" aria-hidden="true"><i id="ops-bar"></i></div>
        </div>
      </section>

      <section class="panel" id="p-scene" aria-labelledby="h-rack">
        <h2 id="h-rack"><span data-t="panel.rack"></span> <small id="scene-total"></small></h2>
        <button id="btn-work" class="stage" type="button">
          <span class="view"><canvas id="c-scene" aria-hidden="true"></canvas></span>
          <span class="work-label"><b data-t="work.btn"></b><small id="work-hint"></small></span>
        </button>
        <p class="keys" data-t="work.keys"></p>
      </section>
      <section class="panel" id="p-alerts" aria-labelledby="h-alerts">
        <h2 id="h-alerts" data-t="panel.alerts"></h2>
        <div id="alerts" aria-live="assertive"></div>
        <div id="effects"></div>
      </section>
      <section class="panel" id="p-log" aria-labelledby="h-log">
        <h2 id="h-log" data-t="panel.log"></h2>
        <ol id="log" class="scroll" aria-live="off"></ol>
      </section>
    </div>

    <section class="panel" id="p-shop" aria-labelledby="h-shop">
      <h2 id="h-shop" data-t="panel.shop"></h2>
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="hw" data-t="shop.hw"></button>
        <button type="button" role="tab" data-tab="pw" data-t="shop.pw"></button>
        <button type="button" role="tab" data-tab="cl" data-t="shop.cl"></button>
        <button type="button" role="tab" data-tab="st" data-t="shop.st"></button>
        <button type="button" role="tab" data-tab="up" data-t="shop.up"></button>
      </div>
      <div class="amount" id="amount" role="group">
        <span data-t="shop.amount"></span>
        <div class="radio">
          <button type="button" data-n="1">×1</button>
          <button type="button" data-n="10">×10</button>
          <button type="button" data-n="max" data-t="shop.max"></button>
        </div>
      </div>
      <p class="sub" id="shop-note" hidden></p>
      <div id="shop" class="scroll" role="tabpanel"></div>
    </section>
  </main>

  <dialog id="dlg-exit" aria-labelledby="h-exit">
    <h2 id="h-exit" data-t="exit.title"></h2>
    <p data-t="exit.body"></p>
    <p id="exit-keep"></p>
    <p id="exit-gain" class="strong"></p>
    <div class="actions">
      <button type="button" class="btn" id="btn-perks" data-t="reborn.open"></button>
      <button type="button" class="btn" data-close data-t="exit.cancel"></button>
      <button type="button" class="btn primary" id="btn-exit-go" data-t="exit.confirm"></button>
    </div>
  </dialog>

  <dialog id="dlg-reborn" aria-labelledby="h-reborn">
    <h2 id="h-reborn" tabindex="-1" data-t="reborn.title"></h2>
    <p id="reborn-intro"></p>
    <p id="reborn-balance" class="strong"></p>
    <p id="reborn-bonus"></p>
    <ul id="perks"></ul>
    <div class="actions">
      <button type="button" class="btn primary" id="btn-reborn-go"></button>
    </div>
  </dialog>

  <dialog id="dlg-stats" aria-labelledby="h-stats">
    <h2 id="h-stats" tabindex="-1" data-t="stats.title"></h2>
    <dl id="stats"></dl>
    <h3><span data-t="ach.title"></span> <small id="ach-count"></small></h3>
    <ul id="achievements"></ul>
    <h3 data-t="settings.title"></h3>
    <div class="actions start">
      <button type="button" class="btn danger" id="btn-reset" data-t="settings.reset"></button>
    </div>
    <div class="actions">
      <button type="button" class="btn primary" data-close data-t="close"></button>
    </div>
  </dialog>

  <dialog id="dlg-offline" aria-labelledby="h-offline">
    <h2 id="h-offline" data-t="offline.title"></h2>
    <p id="offline-body"></p>
    <p id="offline-eff"></p>
    <p id="offline-capped" hidden></p>
    <div class="actions">
      <button type="button" class="btn primary" data-close data-t="ok"></button>
    </div>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
